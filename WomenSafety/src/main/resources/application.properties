spring.application.name=WomenSafety
server.port=8080

# Comma-separated browser origins allowed to connect to the signaling WebSocket.
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:https://major-project-frontend-blond.vercel.app,https://major-project-frontend-*-ayushsingh0702s-projects.vercel.app,http://localhost:*,http://127.0.0.1:*}

# Logging levels
logging.level.com.example.womensafety=DEBUG
logging.level.org.springframework.web.socket=INFO

# Comma-separated TURN URLs, e.g. turn:turn.example.com:3478?transport=udp,turns:turn.example.com:5349?transport=tcp
# The provider must support Coturn-style REST credentials (timestamp username + HMAC-SHA1 shared secret).
webrtc.turn.urls=${WEBRTC_TURN_URLS:}
webrtc.turn.shared-secret=${WEBRTC_TURN_SHARED_SECRET:}
webrtc.turn.credential-ttl-seconds=${WEBRTC_TURN_CREDENTIAL_TTL_SECONDS:3600}
