<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Phone Camera Live Capture Interface - Women Safety">
    <title>Phone Camera - Women Safety</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation Header -->
        <header class="navbar">
            <a href="../index.html" class="brand" id="brand-home-link">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
                <div class="brand-name">Women<span>Safety</span></div>
            </a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link" id="nav-back-home">
                    &larr; Back to Home
                </a>
            </div>
        </header>

        <!-- Main Phone Stream Interface -->
        <main class="phone-layout">
            <div class="page-header">
                <h1 class="page-title">Phone Camera</h1>
                <p class="page-subtitle">Stream live video directly to the monitoring dashboard</p>
            </div>

            <div class="glass-card" id="camera-card-container">
                <!-- Camera Preview Reserved Area -->
                <div class="camera-preview-container" id="camera-preview-box">
                    <div class="camera-status-overlay">
                        <span class="badge badge-disconnected" id="camera-stream-badge">
                            <span class="badge-dot"></span> Camera Inactive
                        </span>
                    </div>

                    <!-- Placeholder / Future Video Tag -->
                    <div class="camera-preview-placeholder" id="camera-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>Camera preview will appear here</span>
                    </div>

                    <video id="camera-video-feed" playsinline autoplay muted style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
                </div>

                <!-- Controls -->
                <div class="camera-controls-grid">
                    <button type="button" class="btn btn-primary" id="btn-start-camera">
                        Start Camera
                    </button>
                    <button type="button" class="btn btn-danger" id="btn-stop-camera">
                        Stop Camera
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Women Safety System. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts (no functionality implemented yet) -->
    <script src="../js/app.js"></script>
    <script src="../js/camera.js"></script>
</body>
</html>
